<!-- ============================================================
  あそびば共通SVGアイコンスプライト（icons.svg）
  各ページの body 直後にある「@shared:icons」マーカーの位置に自動展開される。
  使い方: <svg class="ic"><use href="#ic-menu"/></svg>
  すべて currentColor で描画されるので、親要素の color がそのまま色になる。
  線アイコンは stroke、面アイコンは fill。24×24 viewBox・線幅2で統一。
============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <!-- ── ナビゲーション・UI ── -->
    <symbol id="ic-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </symbol>
    <symbol id="ic-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5m6 6-6-6 6-6"/>
    </symbol>
    <symbol id="ic-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4 11 8-7 8 7M6.5 9.5V20h11V9.5"/>
    </symbol>
    <symbol id="ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6 6 18"/>
    </symbol>
    <symbol id="ic-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M8.6 9.1a3.4 3.4 0 1 1 4.9 3c-1 .5-1.5 1.2-1.5 2.2v.5"/>
      <circle cx="12" cy="18.4" r="1.35" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ic-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="6" r="1.5" fill="currentColor" stroke="none"/>
      <path d="M12 10v8.5"/>
    </symbol>
    <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4.5 12.5 5 5L19.5 7"/>
    </symbol>
    <symbol id="ic-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2 2.6 19.8h18.8z"/>
      <path d="M12 9.5v4.4"/>
      <circle cx="12" cy="16.8" r="1.2" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ic-play" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="M8 5.2 19.2 12 8 18.8z"/>
    </symbol>
    <symbol id="ic-restart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 4.5V10h-5.5"/>
      <path d="M20.2 14.2A8.6 8.6 0 1 1 18.6 7l2.9 3"/>
    </symbol>
    <symbol id="ic-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.5 4H4.5v16h6"/>
      <path d="m15 8 4 4-4 4M19 12H9.5"/>
    </symbol>
    <symbol id="ic-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/>
      <circle cx="12" cy="12" r="2.8"/>
    </symbol>

    <!-- ── サウンド ── -->
    <symbol id="ic-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6.5 9H3v6h3.5L11 19z" fill="currentColor" stroke-width="1.4"/>
      <path d="M14.5 9a4.2 4.2 0 0 1 0 6M17.3 6.4a8.2 8.2 0 0 1 0 11.2"/>
    </symbol>
    <symbol id="ic-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6.5 9H3v6h3.5L11 19z" fill="currentColor" stroke-width="1.4"/>
      <path d="m15.5 9.5 5 5M20.5 9.5l-5 5"/>
    </symbol>
    <symbol id="ic-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 17.5V6.2l9-1.8v10.9"/>
      <circle cx="6.7" cy="17.6" r="2.3" fill="currentColor" stroke="none"/>
      <circle cx="15.7" cy="15.4" r="2.3" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- ── 汎用ゲーム記号 ── -->
    <symbol id="ic-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v15H6.5A2.5 2.5 0 0 0 4 19.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>
    </symbol>
    <symbol id="ic-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 21h8M12 21v-4M7 3h10v6a5 5 0 0 1-10 0z"/>
      <path d="M7 5H4v1.5A3.5 3.5 0 0 0 7.5 10M17 5h3v1.5A3.5 3.5 0 0 1 16.5 10"/>
    </symbol>
    <symbol id="ic-crown" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M3.5 18.5h17L19 8.5l-4.6 4L12 5.2l-2.4 7.3-4.6-4z"/>
    </symbol>
    <symbol id="ic-star" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="m12 2.8 2.8 5.9 6.4.9-4.6 4.5 1.1 6.4L12 17.4l-5.7 3.1 1.1-6.4L2.8 9.6l6.4-.9z"/>
    </symbol>
    <symbol id="ic-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="9" cy="8" r="3.4"/>
      <path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/>
      <path d="M16.4 5.2a3.4 3.4 0 0 1 0 5.9M17.2 14.6a6.2 6.2 0 0 1 4 5.4"/>
    </symbol>
    <symbol id="ic-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M3.5 12h17M12 3.5c3.1 2.7 3.1 14.3 0 17M12 3.5c-3.1 2.7-3.1 14.3 0 17"/>
    </symbol>
    <symbol id="ic-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.5V12l3.2 1.9"/>
    </symbol>
    <symbol id="ic-dice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/>
      <circle cx="8.2" cy="8.2" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="15.8" cy="8.2" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="8.2" cy="15.8" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="15.8" cy="15.8" r="1.5" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ic-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 21V4"/>
      <path d="M5 4.5c2.6-1.7 5.2 1.3 8 .4 2.4-.8 5-1.4 5-1.4v8.8s-2.6.6-5 1.4c-2.8.9-5.4-2.1-8-.4"/>
    </symbol>
    <symbol id="ic-updown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 20V4M8 4 4.8 7.2M8 4l3.2 3.2"/>
      <path d="M16 4v16M16 20l-3.2-3.2M16 20l3.2-3.2"/>
    </symbol>

    <!-- ── テーマ用（面アイコン多め） ── -->
    <symbol id="ic-coin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="8.5"/>
      <circle cx="12" cy="12" r="4.6"/>
    </symbol>
    <symbol id="ic-chip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.3"/>
      <circle cx="12" cy="12" r="4.4"/>
      <path d="M12 3.7v2.6M12 17.7v2.6M3.7 12h2.6M17.7 12h2.6"/>
    </symbol>
    <symbol id="ic-skull" viewBox="0 0 24 24" fill="currentColor" stroke="none" fill-rule="evenodd">
      <path d="M12 2.6a7.6 7.6 0 0 0-7.6 7.6c0 2.5 1.3 4.5 3 5.8V19a2.2 2.2 0 0 0 2.2 2.2h4.8A2.2 2.2 0 0 0 16.6 19v-3c1.7-1.3 3-3.3 3-5.8A7.6 7.6 0 0 0 12 2.6zm-3 6.1a1.95 1.95 0 1 1 0 3.9 1.95 1.95 0 0 1 0-3.9zm6 0a1.95 1.95 0 1 1 0 3.9 1.95 1.95 0 0 1 0-3.9zM12 13.4l1.35 2.5h-2.7z"/>
    </symbol>
    <symbol id="ic-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.8 19h18.4"/>
      <path d="M2.8 19 9.1 7.4l4 7.2"/>
      <path d="m11.7 12.7 3-4.7L21.2 19"/>
    </symbol>
    <symbol id="ic-envelope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="3" y="5.5" width="18" height="13" rx="2"/>
      <path d="m3.6 7.2 8.4 6 8.4-6"/>
    </symbol>
    <symbol id="ic-seal" viewBox="0 0 24 24" fill="currentColor" stroke="none" fill-rule="evenodd">
      <path d="M12 3.4a8.6 8.6 0 1 0 0 17.2 8.6 8.6 0 0 0 0-17.2zm0 3a5.6 5.6 0 1 1 0 11.2 5.6 5.6 0 0 1 0-11.2zm0 1.3a4.3 4.3 0 1 0 0 8.6 4.3 4.3 0 0 0 0-8.6z"/>
    </symbol>
    <symbol id="ic-spy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M8.1 9.6c0-3.2 1.3-4.9 3.9-4.9s3.9 1.7 3.9 4.9z" fill="currentColor" stroke-width="1.2"/>
      <path d="M4.5 10h15"/>
      <circle cx="9.5" cy="14.6" r="2.1"/>
      <circle cx="14.5" cy="14.6" r="2.1"/>
      <path d="M11.6 14.6h.8"/>
    </symbol>

    <!-- ── 定番ゲーム用（2026-08-23 追加。既存IDは変更しない） ── -->
    <!-- トランプ2枚（大富豪・ババ抜き・神経衰弱・BJ・ポーカー） -->
    <symbol id="ic-cards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7.5" width="11.5" height="14" rx="2"/>
      <path d="M8.5 7.5V5.5a2 2 0 0 1 2-2H19a2 2 0 0 1 2 2v11.2a2 2 0 0 1-2 2h-4.5"/>
      <path d="m8.75 11.6 2.2 2.9-2.2 2.9-2.2-2.9z" fill="currentColor" stroke="none"/>
    </symbol>
    <!-- 格子盤（将棋・チェス・オセロの盤） -->
    <symbol id="ic-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
      <path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/>
    </symbol>
    <!-- 石（オセロ。半分塗り＝白黒が返る） -->
    <symbol id="ic-disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/>
    </symbol>
    <!-- キング（チェス） -->
    <symbol id="ic-king" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5v4.6M9.7 4.8h4.6"/>
      <path d="M8.2 10.2h7.6l1.4 7H6.8z"/>
      <path d="M6 20.5h12"/>
    </symbol>
  </defs>
</svg>
