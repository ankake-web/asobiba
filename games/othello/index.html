<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2a1f">
<title>リバーシ — あそびば</title>
<!-- 旧URL /games/othello/ → 新URL /games/reversi/ への転送ページ（2026-09-05 改名）。
     公開済みURL・SNSに貼られたリンク・招待URL（…/othello/#1234）が生きているので、この1枚だけ残す。
     JS が動けば #部屋コード と ?クエリ も引き継いで即転送。動かない環境は meta refresh で転送（コードは引き継げない）。
     ゲーム本体・素材はすべて games/reversi/ にある。 -->
<meta http-equiv="refresh" content="0; url=../reversi/">
<script>
(function () {
  var p = location.pathname.replace(/\/othello(\/(index\.html)?)?$/, "/reversi/");
  if (p === location.pathname) p = "../reversi/";
  location.replace(p + location.search + location.hash);
})();
</script>
<style>
  html, body { margin: 0; min-height: 100%; background: #0f2a1f; color: #f3eadb; font-family: system-ui, sans-serif; }
  main { display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center; line-height: 1.7; }
  a { color: #9be3b8; font-weight: 700; }
</style>
</head>
<body>
<main>
  <p>このゲームは「リバーシ」として <a href="../reversi/">新しいページ</a> に移りました。<br>自動で移動しない場合はリンクを押してください。</p>
</main>
</body>
</html>
